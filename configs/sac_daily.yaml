# configs/ppo_daily.yaml
env:
  reward_type: "log_return"
  reward_params:
    scale: 1000.0        # было 100

agent:
  name: "sac"
  learning_rate: 1.0e-4
  buffer_size: 100000
  learning_starts: 1000
  batch_size: 256
  tau: 0.005

training:
  total_timesteps: 500000
  early_stopping_patience: 20

normalize:
  norm_obs: true
  norm_reward: false    # было true
  clip_obs: 10.0