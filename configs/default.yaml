# ============================================================
# Базовая конфигурация RL-трейдера
# ============================================================

seed: 42
device: "cpu"   # "cpu" или "cuda"

data:
  tickers: ["AAPL"]
  start: "2015-01-01"
  end: "2023-12-31"
  interval: "1d"              # 1d, 1h, 1m
  indicators: ["rsi", "macd", "bb"]
  # Параметры индикаторов
  rsi_window: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_window: 20
  bb_std: 2.0

split:
  method: "walk_forward"      # walk_forward | simple
  train_ratio: 0.7
  val_ratio: 0.15
  # для walk_forward
  n_splits: 3
  test_size: 0.2

env:
  lookback: 30                # окно истории в state
  initial_balance: 100000.0
  commission: 0.001           # 0.1% от сделки
  slippage: 0.0005            # 0.05%
  hmax: 100                   # макс. объём одной сделки
  reward_type: "log_return"   # pnl | log_return | sharpe | cost_aware
  reward_params: {}

agent:
  name: "ppo"                 # ppo | a2c | sac | td3 | dqn
  policy: "MlpPolicy"
  learning_rate: 3.0e-4
  gamma: 0.99
  n_steps: 2048               # для PPO/A2C
  batch_size: 64
  n_epochs: 10                # для PPO
  clip_range: 0.2             # для PPO
  ent_coef: 0.0
  # для off-policy (SAC/TD3/DQN)
  buffer_size: 100000
  learning_starts: 1000
  tau: 0.005
  train_freq: 1
  gradient_steps: 1
  net_arch: [64, 64]          # размеры скрытых слоёв

training:
  total_timesteps: 200000
  eval_freq: 5000
  n_eval_episodes: 5
  save_freq: 10000
  early_stopping_patience: 10 # эпизодов без улучшения

normalize:
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  logs: "logs"
  checkpoints: "checkpoints"
  best_model: "best_model"
  tensorboard: "tb_logs"